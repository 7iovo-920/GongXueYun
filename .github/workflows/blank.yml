name: 工学云自动打卡

on:
  # 支持在 GitHub Actions 页面手动运行
  workflow_dispatch:

  # 北京时间 08:40 和 17:00
  # GitHub Actions cron 使用 UTC，这里分别对应 00:40 和 09:00 UTC
  schedule:
    - cron: "40 0 * * *"
    - cron: "0 9 * * *"

# 防止同一时间重复启动多个打卡任务
concurrency:
  group: gongxueyun-checkin
  cancel-in-progress: true

jobs:
  checkin:
    name: 执行自动打卡
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      # 获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 设置 Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 执行一次完整工学云任务
      # USER 必须在仓库 Settings -> Secrets and variables -> Actions 中配置
      - name: Run GongXueYun task
        env:
          USER: ${{ secrets.USER }}
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      # 任务失败时给出明确提示
      - name: Show failure summary
        if: failure()
        run: |
          echo "工学云自动打卡任务执行失败，请打开当前 Actions 运行记录查看详细日志。"

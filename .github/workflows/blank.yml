name: 工学云自动打卡

on:
  workflow_dispatch:

  # GitHub Actions 使用 UTC。
  # 00:40 UTC = 北京时间 08:40：执行上班任务
  # 09:10 UTC = 北京时间 17:10：执行下班任务
  schedule:
    - cron: "40 0 * * *"
    - cron: "10 9 * * *"

# 防止同一任务在异常情况下重复运行。
concurrency:
  group: gongxueyun-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 执行自动打卡
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect scheduled task type
        id: task_type
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          # 手动运行时，根据北京时间判断应该执行哪一种任务。
          # 自动 schedule 运行时，根据触发时刻判断：
          # 08:40 左右 -> 上班
          # 17:10 左右 -> 下班
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          event = os.environ.get("EVENT_NAME", "")

          if event == "schedule":
              if now.hour < 12:
                  task = "morning"
              else:
                  task = "evening"
          else:
              # 手动运行：上午执行上班，下午执行下班。
              task = "morning" if now.hour < 12 else "evening"

          print(f"当前北京时间: {now:%Y-%m-%d %H:%M:%S}")
          print(f"任务类型: {task}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"type={task}\n")
          PY

      - name: Run GongXueYun task
        env:
          USER: ${{ secrets.USER }}
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Show success summary
        if: success()
        run: |
          echo "工学云自动任务执行完成。"

      - name: Show failure summary
        if: failure()
        run: |
          echo "工学云自动任务执行失败，请打开当前 Actions 运行记录查看详细日志。"